# Link the Windows library Plugin with the static CRT. The Harness resolves
# a library Plugin's own dependencies only beside it and in System32, so a
# Plugin that needs the MSVC runtime DLLs loads only on a machine that has
# them installed there.
# rust-lld ships in the toolchain and links several times faster than the
# stock MSVC linker; it resolves from the rustlib bin directory by name.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

# Clippy appends a docs-link line to every diagnostic; the lint name already
# identifies it.
[env]
CLIPPY_DISABLE_DOCS_LINKS = "1"
