[package]
name = "plugin-std"
version = "0.1.0"
description = "The std Plugin for runvil: the standard file tools a coding agent needs"
edition.workspace = true
license.workspace = true
publish = false

# A dynamic library for a Host's Plugin directory, and an rlib, so a Host
# can also link the Plugin in with `dll` off.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The Plugin contract's safe layer: the `Plugin` and `Pack` traits, what a
# tool call is lent, and the entry point.
runvil-plugin-sdk.workspace = true
# Each tool's definition is embedded JSON, parsed when the Plugin loads,
# and a call's arguments arrive as JSON text.
serde.workspace = true
serde_json.workspace = true
# Grep compiles its pattern with Rust regex syntax.
regex.workspace = true

[dev-dependencies]
# `testing`, the fake Host, and its `Files` tree, which lends the tools a
# run's files without a Harness.
runvil-plugin-sdk = { workspace = true, features = ["test-support"] }

[features]
default = ["dll"]
# Exports `runvil_plugin`. A Host that links this crate in turns it off,
# because two linked Plugins exporting the symbol cannot share one binary.
dll = []

[lints]
workspace = true
